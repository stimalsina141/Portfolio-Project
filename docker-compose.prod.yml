services:
  myportfolio:
    build: .
    container_name: myportfolio
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mariadb:10.5
    container_name: mysql
    restart: always
    env_file:
      - .env
    volumes:
      - mydatabase:/var/lib/mysql
  
  nginx:
    container_name: nginx
    image: jonasal/nginx-certbot
    restart: always
    environment:
      - CERTBOT_EMAIL=timalsinasmriti17@gmail.com
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./user_conf.d:/etc/nginx/user_conf.d
    depends_on:
      - myportfolio

       

volumes:
  mydatabase:
  nginx_secrets:
